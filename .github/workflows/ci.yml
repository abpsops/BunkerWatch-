name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npm run typecheck

      - name: Build (standard, code-split)
        run: npm run build

      - name: Build (single-file web app)
        run: npm run build:webapp

      - name: Upload standard build
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

      - name: Upload single-file web app
        uses: actions/upload-artifact@v4
        with:
          name: bunker-watch-webapp
          path: dist-singlefile/index.html
